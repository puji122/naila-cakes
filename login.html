<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | Naila's Cake</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, var(--coklat-tua) 0%, var(--coklat) 55%, var(--coklat-cerah) 100%); padding: 20px; }
    .login-kartu { background: var(--putih); border-radius: 22px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35); padding: 44px 38px; width: 100%; max-width: 400px; text-align: center; }
    .login-kartu img { height: 84px; width: auto; margin: 0 auto 12px; }
    .login-kartu h1 { font-family: 'Playfair Display', Georgia, serif; color: var(--coklat); font-size: 1.5rem; margin-bottom: 4px; }
    .login-kartu p.sub { color: var(--abu); font-size: 0.88rem; margin-bottom: 26px; }
    .login-kartu .form-group { text-align: left; }
    .login-kartu .btn { width: 100%; margin-top: 8px; }
    .login-batal { display: inline-block; margin-top: 16px; color: var(--abu); font-size: 0.85rem; }
    .login-batal:hover { color: var(--coklat-cerah); }
  </style>
</head>
<body>

  <div class="login-kartu">
    <img src="assets/logo.svg" alt="Naila's Cake">
    <h1>Login Admin</h1>
    <p class="sub">Masuk untuk mengelola pesanan dan produk.</p>

    <form id="formLogin">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-emas" type="submit">Masuk</button>
    </form>

    <div class="form-pesan" id="pesan"></div>

    <a class="login-batal" href="index.html">&larr; Kembali ke situs</a>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
